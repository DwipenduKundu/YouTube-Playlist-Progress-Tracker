{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Email</title>
    <link rel="stylesheet" href="{% static 'tracker/css/password_reset.css' %}">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">

        <div class="icon">✓</div>

        <h1>Check your email</h1>

        <p class="subtitle">
            If an account exists with that email address,
            you will receive a password reset link shortly.
        </p>

        <a href="{% url 'tracker:login' %}" class="submit-btn button-link">
            Back to login
        </a>

    </div>
</div>

</body>
</html>
