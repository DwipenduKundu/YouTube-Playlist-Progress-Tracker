{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Changed</title>
    <link rel="stylesheet" href="{% static 'tracker/css/password_reset.css' %}">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">

        <div class="icon">✓</div>

        <h1>Password changed!</h1>

        <p class="subtitle">
            Your password has been updated successfully.
            You can now log in using your new password.
        </p>

        <a href="{% url 'tracker:login' %}"
           class="submit-btn button-link">
            Login now
        </a>

    </div>
</div>

</body>
</html>
