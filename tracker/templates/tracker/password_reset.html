{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{% static 'tracker/css/password_reset.css' %}">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">

        <div class="icon">✉</div>

        <h1>Forgot password?</h1>

        <p class="subtitle">
            Enter your registered email address.
            We'll send you a link to reset your password.
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_email">Email address</label>
                <input
                    type="email"
                    name="email"
                    id="id_email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <button type="submit" class="submit-btn">
                Send reset link
            </button>
        </form>

        <p class="bottom-text">
            <a href="{% url 'tracker:login' %}">Back to login</a>
        </p>

    </div>
</div>

</body>
</html>
